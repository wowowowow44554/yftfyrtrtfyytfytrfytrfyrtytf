<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PU.AX — One Man vs The Bone Horde</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    background: #050505;
    color: #ff2222;
    font-family: "Courier New", Courier, monospace;
    min-height: 100vh;
    overflow-x: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 28%, rgba(160,0,0,.16), transparent 55%),
                radial-gradient(circle at 50% 105%, rgba(90,0,0,.28), transparent 62%);
    pointer-events: none;
    z-index: -1;
}

/* ================= LANDING ================= */
#landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px 10px;
    position: relative;
}
.fog {
    position: fixed;
    bottom: -12%;
    left: -10%;
    width: 120%;
    height: 45%;
    background: radial-gradient(ellipse at center, rgba(70,0,0,.35), transparent 65%);
    filter: blur(30px);
    animation: fogdrift 11s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
}
.fog.f2 { animation-duration: 17s; animation-delay: -6s; opacity:.6; }
@keyframes fogdrift {
    from { transform: translateX(-6%) scale(1); }
    to   { transform: translateX(7%)  scale(1.12); }
}
#skull-svg {
    width: clamp(240px, 38vmin, 430px);
    filter: drop-shadow(0 0 26px rgba(255,0,0,.35));
    position: relative;
    z-index: 1;
}
.eye-glow { animation: eyeglow 2.6s ease-in-out infinite; }
@keyframes eyeglow {
    0%, 100% { opacity:.85; }
    45%      { opacity:.25; }
    52%      { opacity:1; }
}
.jaw-group { animation: jawsway 5.5s ease-in-out infinite; transform-origin: 200px 320px; }
@keyframes jawsway {
    0%, 100% { transform: rotate(-1.2deg) translateY(0); }
    50%      { transform: rotate(1.4deg) translateY(3px); }
}
.crack-flicker { animation: crackflick 7s steps(1) infinite; }
@keyframes crackflick {
    0%, 91%, 94%, 100% { opacity: 1; }
    92%, 95.5% { opacity: .25; }
}
.tagline {
    margin-top: 22px;
    font-size: clamp(11px, 1.6vw, 15px);
    letter-spacing: 5px;
    color: #b30000;
    text-shadow: 0 0 10px rgba(255,0,0,.55);
    animation: flicker 4.5s linear infinite;
    position: relative;
    z-index: 1;
}
button.enter {
    margin-top: 30px;
    background: transparent;
    border: 1px solid #ff2222;
    color: #ff2222;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 4px;
    padding: 16px 38px;
    cursor: pointer;
    transition: .25s;
    box-shadow: 0 0 12px rgba(255,0,0,.25), inset 0 0 12px rgba(255,0,0,.08);
    position: relative;
    z-index: 1;
}
button.enter:hover {
    background: rgba(255,0,0,.15);
    box-shadow: 0 0 28px rgba(255,0,0,.6), inset 0 0 20px rgba(255,0,0,.15);
    transform: translateY(-2px);
}
.hint {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #7a0000;
    line-height: 2;
    position: relative;
    z-index: 1;
}
footer {
    position: fixed;
    bottom: 12px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: #5c0000;
    z-index: 1;
}
@keyframes flicker {
    0%, 19%, 21%, 23%, 80%, 100% { opacity: 1; }
    20%, 22%, 81% { opacity: .3; }
}

/* ================= GAME ================= */
#game-wrap { display:none; position: fixed; inset: 0; background:#050505; z-index: 100; }
#game-canvas { display:block; width:100%; height:100%; }
#hud {
    position:absolute; top:12px; left:0; width:100%;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: 0 20px;
    font-size:14px; letter-spacing:2px; color:#ff3333;
    text-shadow: 0 0 8px rgba(255,0,0,.6);
    pointer-events:none; user-select:none; z-index:5;
}
.meter {
    height: 8px; margin-top: 6px;
    border: 1px solid rgba(255,60,60,.5);
    background: rgba(40,0,0,.5);
}
.meter > div { height: 100%; width: 0%; transition: width .15s; }
#rage-fill { background: linear-gradient(90deg,#ff2222,#ffaa00); box-shadow: 0 0 10px rgba(255,60,0,.8); }
#boss-bar-wrap { display:none; position:absolute; top:64px; left:50%; transform:translateX(-50%); width:min(520px,70vw); text-align:center; z-index:5; pointer-events:none; }
#boss-bar-label { font-size:12px; letter-spacing:5px; color:#ff4444; text-shadow:0 0 10px rgba(255,0,0,.8); margin-bottom:4px; }
#boss-bar { height:10px; border:1px solid rgba(255,60,60,.6); background:rgba(30,0,0,.6); }
#boss-bar > div { height:100%; width:100%; background:linear-gradient(90deg,#aa0000,#ff2222); box-shadow:0 0 12px rgba(255,0,0,.9); }
#overlay {
    position:absolute; inset:0; display:none;
    flex-direction:column; justify-content:center; align-items:center; text-align:center;
    background: rgba(8,0,0,.84); z-index:10;
}
#overlay h2 {
    font-size: clamp(26px, 5.5vw, 50px);
    letter-spacing: 9px; color:#ff2222;
    text-shadow: 0 0 22px rgba(255,0,0,.85);
}
#overlay p {
    margin-top: 18px; font-size:13px; letter-spacing:2px;
    color:#cc5555; line-height:2.1;
}
#touch-controls {
    position:absolute; bottom:14px; left:0; width:100%;
    display:none; justify-content:center; gap:10px; flex-wrap:wrap;
    z-index:6;
}
.tbtn {
    width:58px; height:58px; border-radius:50%;
    border:1px solid rgba(255,40,40,.55);
    background: rgba(255,0,0,.07);
    color:#ff5555; font-size:19px; font-family:inherit;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
.tbtn:active { background: rgba(255,0,0,.3); }

/* ================= PAYLOAD OVERLAY ================= */
#game-container {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #000;
    justify-content: center;
    align-items: center;
}
#game-image { width: 100%; height: 100%; object-fit: cover; display: block; }
#ip-address {
    display: none;
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    color: #ff4444;
    font-weight: bold;
    font-family: "Courier New", Courier, monospace;
    font-size: clamp(18px, 3vw, 32px);
    letter-spacing: 4px;
    text-shadow:
        0 0 6px  rgba(255,0,0,.95),
        0 0 14px rgba(255,0,0,.85),
        0 0 30px rgba(255,0,0,.7),
        0 0 55px rgba(255,0,0,.5);
    z-index: 201;
    pointer-events: none;
    white-space: nowrap;
    animation: ipdrift 9s ease-in-out infinite alternate,
               ipbob 3.2s ease-in-out infinite alternate,
               ippulse 1.1s ease-in-out infinite alternate;
}
@keyframes ippulse {
    from { filter: brightness(1); }
    to   { filter: brightness(1.6) drop-shadow(0 0 12px rgba(255,0,0,.9)); }
}
@keyframes ipdrift {
    from { left: 16%; }
    to   { left: 84%; }
}
@keyframes ipbob {
    from { top: 8vh; }
    to   { top: 82vh; }
}
</style>
</head>
<body>

<div id="landing">
<div class="fog"></div>
<div class="fog f2"></div>

<svg id="skull-svg" viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg" aria-label="Horror skull">
  <defs>
    <radialGradient id="bone" cx="42%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#efe8da"/>
      <stop offset="55%" stop-color="#c9bfae"/>
      <stop offset="82%" stop-color="#8f8574"/>
      <stop offset="100%" stop-color="#4d463c"/>
    </radialGradient>
    <radialGradient id="socketG" cx="50%" cy="45%" r="65%">

      <stop offset="70%" stop-color="#0c0202"/>
      <stop offset="100%" stop-color="#2a0505"/>
    </radialGradient>
    <radialGradient id="hellfire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9d9"/>

  <!-- cranium -->
  <path fill="url(#bone)" d="
    M200 22 C 118 22 62 82 60 168 C 59 216 74 252 96 276
    C 112 294 122 306 124 330 L 132 372 C 134 384 142 392 154 392
    L 246 392 C 258 392 266 384 268 372 L 276 330
    C 278 306 288 294 304 276 C 326 252 341 216 340 168
    C 338 82 282 22 200 22 Z"/>
  <!-- side shading -->
  <path fill="#3f3830" opacity=".45" filter="url(#soft)" d="M78 190 C 76 130 104 66 158 46 C 108 72 88 130 90 192 C 91 232 102 262 118 282 C 98 264 80 228 78 190 Z"/>
  <path fill="#3f3830" opacity=".35" filter="url(#soft)" d="M322 190 C 324 130 296 66 242 46 C 292 72 312 130 310 192 C 309 232 298 262 282 282 C 302 264 320 228 322 190 Z"/>

  <!-- brow ridge -->
  <path fill="none" stroke="#5d5446" stroke-width="7" stroke-linecap="round" opacity=".8"
        d="M104 172 C 128 152 168 148 186 164 M214 164 C 232 148 272 152 296 172"/>

  <!-- eye sockets -->
  <ellipse cx="146" cy="204" rx="44" ry="36" fill="url(#socketG)"/>

  <g class="eye-glow" filter="url(#glowRed)">
    <circle cx="146" cy="206" r="15" fill="url(#hellfire)"/>
    <circle cx="254" cy="206" r="15" fill="url(#hellfire)"/>
    <circle cx="146" cy="206" r="5" fill="#ffe9c9" opacity=".9"/>
    <circle cx="254" cy="206" r="5" fill="#ffe9c9" opacity=".9"/>
  </g>

  <!-- nasal cavity -->
  <path fill="url(#socketG)" d="M200 236 L 178 292 C 176 300 182 308 191 308 L 209 308 C 218 308 224 300 222 292 Z"/>
  <path fill="#5e0d02" opacity=".8" filter="url(#soft)" d="M196 296 L 204 296 L 202 308 L 198 308 Z"/>

  <!-- cheek hollows -->
  <ellipse cx="112" cy="272" rx="18" ry="26" fill="#33291f" opacity=".5" filter="url(#soft)"/>
  <ellipse cx="288" cy="272" rx="18" ry="26" fill="#33291f" opacity=".5" filter="url(#soft)"/>

  <!-- cracks -->
  <g class="crack-flicker">
    <path fill="none" stroke="#241d16" stroke-width="2.4" stroke-linecap="round"
          d="M238 34 L 252 66 L 244 92 L 260 118 M120 60 L 134 88 L 128 112 L 142 138 M300 120 L 284 148 L 296 170"/>
    <path fill="none" stroke="#241d16" stroke-width="1.8" stroke-linecap="round"
          d="M96 230 L 112 244 L 106 262 M310 226 L 294 242 L 300 258"/>
  </g>

  <!-- upper teeth band -->
  <rect x="140" y="318" width="120" height="34" rx="8" fill="#171310"/>
  <g fill="url(#toothG)" stroke="#241d16" stroke-width="1.5">
    <rect x="144" y="320" width="18" height="30" rx="4"/>
    <rect x="166" y="320" width="18" height="30" rx="4"/>
    <rect x="188" y="320" width="24" height="30" rx="4"/>
    <rect x="216" y="320" width="18" height="30" rx="4"/>
    <rect x="238" y="320" width="18" height="30" rx="4"/>
  </g>
  <text x="200" y="342" text-anchor="middle" font-family="'Courier New',monospace"
        font-size="21" font-weight="bold" fill="#c40e0e" letter-spacing="2"
        style="paint-order:stroke;" stroke="#1a0000" stroke-width="4">PU.AX</text>

  <!-- jaw group -->
  <g class="jaw-group">
    <path fill="url(#bone)" d="M150 396 L 250 396 C 256 396 260 402 258 410
        C 254 430 240 442 200 442 C 160 442 146 430 142 410 C 140 402 144 396 150 396 Z"/>
    <g fill="url(#toothG)" stroke="#241d16" stroke-width="1.5">
      <rect x="156" y="400" width="16" height="22" rx="4"/>
      <rect x="176" y="400" width="16" height="24" rx="4"/>
      <rect x="208" y="400" width="16" height="24" rx="4"/>
      <rect x="228" y="400" width="16" height="22" rx="4"/>
    </g>
    <!-- blood drips -->
    <path fill="#7e0b04" opacity=".9" d="M162 422 c 0 10 2 16 3 22 c 1 -6 3 -12 3 -22 Z"/>
    <path fill="#7e0b04" opacity=".85" d="M232 420 c 0 12 2 20 4 28 c 1.5 -8 3 -16 3 -28 Z" style="animation: eyeglow 3.7s infinite;"/>
  </g>
</svg>

<p class="tagline">&#9876; ONE MAN VS THE BONE HORDE &#9876;</p>

<button class="enter" id="enterBtn">&#9654; ENTER THE HORDE</button>

<p class="hint">
A/D MOVE &middot; W JUMP &middot; J SLASH &middot; J,J,L COMBO &middot; SHIFT DASH<br>
K BLOCK/PARRY &middot; I RAGE WHEN FULL &middot; P PAUSE &middot; R RESTART
</p>
<p class="hint" id="best-hint"></p>
</div>

<footer>PU.AX &mdash; EST. 2026</footer>

<div id="game-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
        <div>
            <span id="hp"></span>
            <div class="meter" style="width:130px;"><div id="rage-fill"></div></div>
            <span id="rage-label" style="font-size:10px;color:#aa5500;">RAGE [I]</span>
        </div>
        <span id="wave">WAVE 1</span>
        <div style="text-align:right;">
            <div id="score">0 PTS</div>

    <img id="game-image" alt="">
    <span id="ip-address"></span>
</div>
<audio id="game-audio" src="assets/game-audio.mp3" loop preload="auto"></audio>

<script>
(function () {
    "use strict";

    /* ============================================================
       AUDIO — synthesized WebAudio SFX (no files, unlocked on click)
       ============================================================ */
    var AC = null;
    function ac() {
        if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        if (AC && AC.state === "suspended") AC.resume();
        return AC;
    }
    function tone(freq, dur, type, vol, slideTo, delay) {
        var c = ac(); if (!c) return;
        var t0 = c.currentTime + (delay || 0);
        var o = c.createOscillator(), g = c.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t0);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
        g.gain.setValueAtTime(vol, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.connect(g); g.connect(c.destination);
        o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function noise(dur, vol, freq, delay) {
        var c = ac(); if (!c) return;
        var t0 = c.currentTime + (delay || 0);
        var len = Math.floor(c.sampleRate * dur);
        var buf = c.createBuffer(1, len, c.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        var src = c.createBufferSource(); src.buffer = buf;
        var f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8;
        var g = c.createGain();
        g.gain.setValueAtTime(vol, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        src.connect(f); f.connect(g); g.connect(c.destination);
        src.start(t0);
    }
    var sfx = {
        slash:  function () { noise(0.07, 0.22, 2800); tone(650, 0.07, "sawtooth", 0.06, 220); },
        heavy:  function () { noise(0.12, 0.3, 1600); tone(300, 0.14, "sawtooth", 0.12, 90); },
        hit:    function () { noise(0.05, 0.28, 1100); tone(190, 0.08, "square", 0.14, 120); },
        clank:  function () { tone(1250, 0.09, "square", 0.12, 900); tone(1850, 0.07, "triangle", 0.08, 1200); },
        parry:  function () { tone(1500, 0.1, "triangle", 0.16, 2400); tone(2200, 0.16, "triangle", 0.12, 3000, 0.03); },
        kill:   function () { noise(0.14, 0.3, 700); tone(140, 0.2, "sawtooth", 0.16, 50); },
        hurt:   function () { tone(230, 0.22, "sawtooth", 0.22, 95); noise(0.1, 0.2, 500); },
        die:    function () { tone(180, 0.7, "sawtooth", 0.25, 40); noise(0.5, 0.3, 300); },
        pickup: function () { tone(660, 0.09, "triangle", 0.14); tone(990, 0.12, "triangle", 0.12, null, 0.07); },
        rageOn: function () { tone(160, 0.5, "sawtooth", 0.2, 640); noise(0.4, 0.18, 900); },
        horn:   function () { tone(92, 0.9, "sawtooth", 0.2, 70); tone(138, 0.9, "sawtooth", 0.14, 100, 0.05); },
        bow:    function () { noise(0.06, 0.14, 2200); tone(900, 0.06, "triangle", 0.06, 400); },
        bossdie:function () { noise(0.8, 0.4, 250); tone(200, 0.9, "sawtooth", 0.25, 30); tone(150, 1.1, "square", 0.15, 25, 0.15); }
    };

    /* ============================================================ LANDING */
    var enterBtn = document.getElementById("enterBtn");
    var landing = document.getElementById("landing");
    var footer = document.querySelector("footer");
    var gameWrap = document.getElementById("game-wrap");
    var bestHint = document.getElementById("best-hint");
    var HS_KEY = "puax_horde_high";
    var highScore = 0;
    try { highScore = parseInt(localStorage.getItem(HS_KEY) || "0", 10) || 0; } catch (e) {}
    if (highScore > 0) bestHint.textContent = "BEST: " + highScore + " PTS";

    /* ============================================================ GAME STATE */
    var canvas = document.getElementById("game-canvas");
    var ctx = canvas.getContext("2d");
    var hpEl = document.getElementById("hp");
    var waveEl = document.getElementById("wave");
    var scoreEl = document.getElementById("score");
    var comboEl = document.getElementById("combo");
    var rageFill = document.getElementById("rage-fill");
    var rageLabel = document.getElementById("rage-label");
    var overlay = document.getElementById("overlay");
    var ovTitle = document.getElementById("ov-title");
    var ovText = document.getElementById("ov-text");
    var bossWrap = document.getElementById("boss-bar-wrap");
    var bossFill = document.querySelector("#boss-bar > div");
    var touchControls = document.getElementById("touch-controls");

    var W = 0, H = 0, groundY = 0;
    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        groundY = H * 0.78;
    }
    window.addEventListener("resize", resize);

    if ("ontouchstart" in window) touchControls.style.display = "flex";

    var keys = {};
    var touchState = {};
    var running = false, paused = false;

    var player, enemies, arrows, pickups, particles, popups, slashes;
    var wave, score, spawnTimer, shake, hitFlash, gameOver, freezeT;
    var kills, bestCombo, startTime, boss = null, bannerT = 0;

    var COMBO_WINDOW = 0.55;
    var ENEMY_CAP = 14;

    function reset() {
        player = {
            x: W * 0.2, y: groundY, vx: 0, vy: 0, w: 34, h: 62,
            onGround: true, facing: 1,
            hp: 5, maxHp: 5,
            rage: 0, rageActive: false, rageT: 0,
            dashCd: 0, dashT: 0,
            invuln: 0,
            blocking: false, blockT: 99,
            attackCd: 0, attackT: 0, attackKind: "",
            comboStep: 0, comboChainT: 0,
            animT: 0
        };
        enemies = []; arrows = []; pickups = []; particles = []; popups = []; slashes = [];
        wave = 0; score = 0; spawnTimer = 0;
        shake = 0; hitFlash = 0; gameOver = false; freezeT = 0;
        kills = 0; bestCombo = 0; startTime = performance.now();
        boss = null; bossWrap.style.display = "none";
        overlay.style.display = "none";
        nextWave();
    }

    function showBanner(title, sub, ms) {
        ovTitle.textContent = title;
        ovText.innerHTML = sub;
        overlay.style.display = "flex";
        bannerT = ms || 1200;
    }

    function nextWave() {
        wave++;
        if (wave % 5 === 0) {
            spawnBoss();
            showBanner("WAVE " + wave + " — THE SKULL-LORD AWAKENS",
                "IT HAS COME TO COLLECT YOUR BONES", 2200);
            sfx.horn();
        } else {
            showBanner("WAVE " + wave, "THE HORDE GROWS...");
            sfx.horn();
        }
    }

    /* ============================================================ SPAWNING */
    function baseStats(type) {
        var w = wave;
        switch (type) {
            case "walker":  return { hp: 1 + Math.floor(w / 4), spd: 60 + w * 6 + Math.random() * 30, dmg: 1, pts: 100 };
            case "crawler": return { hp: 1 + Math.floor(w / 6), spd: 130 + w * 9 + Math.random() * 40, dmg: 1, pts: 150 };
            case "shield":  return { hp: 2 + Math.floor(w / 3), spd: 45 + w * 5,  dmg: 1, pts: 250 };
            case "archer":  return { hp: 1 + Math.floor(w / 5), spd: 40 + w * 3,  dmg: 1, pts: 200 };
        }
    }
    function spawnEnemy(type) {
        var st = baseStats(type);
        var tough = type === "shield";
        enemies.push({
            type: type,
            x: W + 40 + Math.random() * 140,
            y: groundY,
            w: type === "crawler" ? 26 : (tough ? 40 : 32),
            h: type === "crawler" ? 34 : (tough ? 66 : 58),
            hp: st.hp, maxHp: st.hp,
            spd: st.spd * (tough ? 1.1 : 1),
            dmg: st.dmg, pts: st.pts,
            vx: 0, vy: 0, onGround: true,
            facing: -1,
            attackCd: 1 + Math.random(),
            animT: Math.random() * 10,
            hurt: 0, stagger: 0
        });
    }
    function pickType() {
        var r = Math.random();
        if (wave >= 4 && r < 0.2) return "archer";
        if (wave >= 3 && r < 0.4) return "shield";
        if (wave >= 2 && r < 0.65) return "crawler";
        return "walker";
    }
    function spawnBoss() {
        boss = {
            type: "boss",
            x: W + 80, y: groundY - 40,
            w: 110, h: 150,
            hp: 24 + wave * 5, maxHp: 24 + wave * 5,
            spd: 55 + wave,
            dmg: 2,
            pts: 2000,
            vx: 0, vy: 0,
            facing: -1,
            attackCd: 2.2, summonCd: 3.4,
            animT: 0, hurt: 0, stagger: 0
        };
        enemies.push(boss);
        bossWrap.style.display = "block";
    }

    /* ============================================================ FX HELPERS */
    function addParticles(x, y, n, col, spread, up) {
        spread = spread || 260; up = up || 220;
        for (var i = 0; i < n; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * spread,
                vy: -Math.random() * up - 40,
                life: 0.4 + Math.random() * 0.55, t: 0,
                col: col, sz: 2 + Math.random() * 3
            });
        }
    }
    function popup(x, y, txt, col) {
        popups.push({ x: x, y: y, txt: txt, col: col || "#ffb300", t: 0 });
    }

    /* ============================================================ INPUT */
    document.addEventListener("keydown", function (e) {
        var k = e.key.toLowerCase();
        keys[k] = true;
        if (k === "r") { if (gameOver && window.puaxRespawn) window.puaxRespawn(); reset(); }
        if (k === "p" || k === "escape") togglePause();
        if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].indexOf(k) >= 0) e.preventDefault();
    });
    document.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

    Array.prototype.forEach.call(document.querySelectorAll(".tbtn"), function (b) {
        var k = b.getAttribute("data-k");
        function on(e) { e.preventDefault(); if (k === "left" || k === "right") touchState[k] = true; else keys[k] = true; }
        function off(e) { e.preventDefault(); if (k === "left" || k === "right") touchState[k] = false; else keys[k] = false; }
        b.addEventListener("touchstart", on); b.addEventListener("touchend", off);
        b.addEventListener("mousedown", on); b.addEventListener("mouseup", off);
    });

    function togglePause() {
        if (!running || gameOver || bannerT > 0) return;
        paused = !paused;
        if (paused) {
            ovTitle.textContent = "PAUSED";
            ovText.innerHTML = "PRESS P OR ESC TO RESUME";
            overlay.style.display = "flex";
        } else overlay.style.display = "none";
    }

    /* ============================================================ PLAYER DAMAGE */
    function damagePlayer(dmg, srcX, isProjectile) {
        var p = player;
        if (gameOver || p.invuln > 0 || p.dashT > 0) return;
        if (p.blocking) {
            if (p.blockT < 0.18) { // PERFECT PARRY
                sfx.parry();
                popup(p.x, p.y - 80, "PARRY!", "#ffe14d");
                p.rage = Math.min(100, p.rage + 14);
                freezeT = Math.max(freezeT, 0.09);
                shake = Math.max(shake, 8);
                addParticles(p.x + (srcX > p.x ? 30 : -30), p.y - 34, 12, "#ffe14d", 300, 260);
                if (!isProjectile) staggerAttacker(srcX);
                else destroyNearArrow(p.x, 90);
                p.invuln = 0.25;
                return;
            }
            sfx.clank();
            addParticles(p.x + (srcX > p.x ? 28 : -28), p.y - 34, 6, "#cccccc", 200, 160);
            p.vx = (p.x < srcX ? -1 : 1) * 220;
            p.invuln = 0.3;
            return;
        }
        p.hp -= dmg;
        p.comboStep = 0;
        p.invuln = 0.9;
        shake = Math.max(shake, 11);
        hitFlash = 0.4;
        freezeT = Math.max(freezeT, 0.06);
        sfx.hurt();
        addParticles(p.x, p.y - 32, 14, "#ff2222");
        if (p.hp <= 0) endGame();
    }
    function staggerAttacker(srcX) {
        for (var i = 0; i < enemies.length; i++) {
            var e = enemies[i];
            if (Math.abs(e.x - srcX) < 60 && e.type !== "boss") { e.stagger = 1.1; e.vx = (srcX < player.x ? -1 : 1) * 260; }
        }
    }
    function destroyNearArrow(x, r) {
        for (var i = arrows.length - 1; i >= 0; i--) {
            if (Math.abs(arrows[i].x - x) < r) {
                addParticles(arrows[i].x, arrows[i].y, 6, "#dddddd", 180, 140);
                arrows.splice(i, 1);
            }
        }
    }

    /* ============================================================ PLAYER ATTACKS */
    function doAttack(kind) {
        var p = player;
        if (p.attackCd > 0) return;
        var heavy = kind === "heavy" || p.comboStep >= 2;
        p.attackKind = heavy ? "heavy" : (p.comboStep === 1 ? "light2" : "light1");
        p.attackCd = heavy ? 0.55 : 0.3;
        p.attackT = heavy ? 0.22 : 0.15;
        p.comboStep = (p.comboStep + 1) % 3;
        p.comboChainT = COMBO_WINDOW;
        heavy ? sfx.heavy() : sfx.slash();

        var reach = heavy ? 84 : 62;
        var dmgBase = heavy ? 3 : 1;
        if (p.rageActive) dmgBase *= 2;
        var hx1 = p.x + (p.facing === 1 ? 6 : -reach - 6);
        var hx2 = hx1 + reach;
        var fromAbove = !p.onGround;
        var hitAny = false;

        slashes.push({ x: p.x + p.facing * 30, y: p.y - 32, t: 0, dir: p.facing, heavy: heavy });

        for (var i = enemies.length - 1; i >= 0; i--) {
            var e = enemies[i];
            var ex1 = e.x - e.w / 2, ex2 = e.x + e.w / 2;
            if (ex2 > hx1 && ex1 < hx2 && Math.abs((p.y - 30) - (e.y - e.h / 2)) < 70) {
                hitAny = true;
                // shield check: blocks frontal grounded hits
                if (e.type === "shield" && !fromAbove && ((p.facing === 1 && p.x < e.x) || (p.facing === -1 && p.x > e.x))) {
                    sfx.clank();
                    addParticles(e.x + (p.facing * e.w / 2), e.y - 34, 8, "#bbbbbb", 200, 160);
                    popup(e.x, e.y - e.h - 12, "BLOCKED", "#999999");
                    continue;
                }
                hurtEnemy(e, i, dmgBase, heavy);
            }
        }
        // slash destroys arrows too
        for (var a = arrows.length - 1; a >= 0; a--) {
            var ar = arrows[a];
            if (ar.x > hx1 && ar.x < hx2 && ar.y > p.y - 80 && ar.y < p.y) {
                addParticles(ar.x, ar.y, 6, "#dddddd", 180, 140);
                arrows.splice(a, 1);
                score += 10;
            }
        }
        if (hitAny && heavy) freezeT = Math.max(freezeT, 0.07);
    }

    function hurtEnemy(e, idx, dmg, heavy) {
        e.hp -= dmg;
        e.hurt = 0.15;
        if (e.type !== "boss") e.vx = (e.x < player.x ? -1 : 1) * (heavy ? 320 : 140);
        addParticles(e.x, e.y - e.h * 0.5, heavy ? 12 : 7, e.type === "boss" ? "#ff2222" : "#eeeeee");
        sfx.hit();
        if (e.hp <= 0) {
            enemies.splice(idx, 1);
            kills++;
            var gained = e.pts * (player.rageActive ? 2 : 1);
            score += gained;
            popup(e.x, e.y - e.h - 14, "+" + gained, "#ffb300");
            shake = Math.max(shake, e.type === "boss" ? 20 : heavy ? 9 : 6);
            addParticles(e.x, e.y - e.h * 0.5, e.type === "boss" ? 60 : 16, e.toughCol || "#cccccc", 380, 300);
            player.rage = Math.min(100, player.rage + (e.type === "boss" ? 100 : 12));
            if (e.type === "boss") {
                boss = null;
                bossWrap.style.display = "none";
                sfx.bossdie();
                freezeT = 0.25;
                dropPickup(e.x, "heart"); dropPickup(e.x + 40, "rage");
                showBanner("SKULL-LORD VANQUISHED", "+2000", 1600);
            } else {
                sfx.kill();
                var roll = Math.random();
                if (roll < 0.09) dropPickup(e.x, "heart");
                else if (roll < 0.24) dropPickup(e.x, "rage");
            }
        } else if (e.type === "boss") {
            updateBossBar();
        }
    }

    function dropPickup(x, kind) {
        pickups.push({ x: x, y: groundY - 60, vy: -160, kind: kind, t: 0 });
    }

    function activateRage() {
        var p = player;
        if (p.rage < 100 || p.rageActive) return;
        p.rageActive = true; p.rageT = 8; p.rage = 0;
        sfx.rageOn();
        popup(p.x, p.y - 90, "RAGE!", "#ff4400");
        addParticles(p.x, p.y - 30, 26, "#ff5500", 360, 320);
        freezeT = 0.1;
    }

    function endGame() {
        gameOver = true;
        sfx.die();
        addParticles(player.x, player.y - 30, 40, "#ff2222", 420, 340);
        var isBest = score > highScore;
        if (isBest) {
            highScore = score;
            try { localStorage.setItem(HS_KEY, String(highScore)); } catch (e) {}
        }
        var secs = Math.floor((performance.now() - startTime) / 1000);
        ovTitle.textContent = "YOU DIED";
        ovText.innerHTML =
            "SCORE " + score + (isBest ? " &nbsp;<span style='color:#ffb300'>— NEW BEST!</span>" : " &nbsp;/ BEST " + highScore) +
            "<br>WAVE " + wave + " &middot; KILLS " + kills + " &middot; BEST COMBO x" + bestCombo +
            "<br>SURVIVED " + Math.floor(secs / 60) + ":" + ("0" + secs % 60).slice(-2) +
            "<br><br>PRESS R OR TAP TO RISE AGAIN";
        overlay.style.display = "flex";
    }

    overlay.addEventListener("mousedown", function () {
        if (bannerT > 0 || paused) return;
        if (gameOver && window.puaxRespawn) window.puaxRespawn();
        reset();
    });

    /* ============================================================ UPDATE */
    function update(dt) {
        var p = player;
        p.animT += dt;
        if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0 && !gameOver) overlay.style.display = "none"; }

        // timers
        if (p.attackCd > 0) p.attackCd -= dt;
        if (p.attackT > 0) p.attackT -= dt;
        if (p.invuln > 0) p.invuln -= dt;
        if (p.dashCd > 0) p.dashCd -= dt;
        if (p.comboChainT > 0) { p.comboChainT -= dt; if (p.comboChainT <= 0) p.comboStep = 0; }
        if (p.blockT < 99) p.blockT += dt;
        if (p.rageActive) { p.rageT -= dt; if (p.rageT <= 0) p.rageActive = false; }

        // movement
        var mv = 0;
        if (keys["a"] || keys["arrowleft"] || touchState.left) mv -= 1;
        if (keys["d"] || keys["arrowright"] || touchState.right) mv += 1;
        var speed = 300 * (p.rageActive ? 1.35 : 1);

        // dash
        if ((keys["shift"] || keys["dash"]) && p.dashCd <= 0) {
            var dir = mv !== 0 ? mv : p.facing;
            p.dashT = 0.15; p.dashCd = 0.9;
            p.vx = dir * 820;
            p.facing = dir;
            sfx.slash();
        }
        if (p.dashT > 0) {
            p.dashT -= dt;
            addParticles(p.x, p.y - 26, 2, p.rageActive ? "#ff5500" : "#888888", 60, 40);
        } else {
            p.vx = mv * speed;
            if (mv !== 0) p.facing = mv;
        }

        // block
        p.blocking = !!(keys["k"] || keys["block"]);
        if (p.blocking && p.blockT >= 99) p.blockT = 0;
        if (!p.blocking) p.blockT = 99;

        // jump
        if ((keys["w"] || keys["arrowup"] || keys["jump"]) && p.onGround) { p.vy = -640; p.onGround = false; }
        p.vy += 1750 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.y >= groundY) { p.y = groundY; p.vy = 0; p.onGround = true; }
        p.x = Math.max(p.w / 2 + 6, Math.min(W - p.w / 2 - 6, p.x));

        // attacks
        if (keys["j"] || keys["attack"]) { doAttack("light"); keys["j"] = false; keys["attack"] = false; }
        if (keys["l"] || keys["heavy"])  { doAttack("heavy"); keys["l"] = false; keys["heavy"] = false; }
        if (keys["i"] || keys["ragemode"]) activateRage();

        // spawning
        if (!gameOver) {
            spawnTimer += dt * 1000;
            var interval = Math.max(480, 1500 - wave * 90);
            var cap = Math.min(ENEMY_CAP, 3 + wave);
            var normalCount = enemies.filter(function (e) { return e.type !== "boss"; }).length;
            if (spawnTimer >= interval && normalCount < cap) { spawnTimer = 0; spawnEnemy(pickType()); }
        }

        // ---- enemies ----
        for (var i = enemies.length - 1; i >= 0; i--) {
            var e = enemies[i];
            e.animT += dt;
            if (e.hurt > 0) e.hurt -= dt;
            if (e.stagger > 0) { e.stagger -= dt; e.x += e.vx * dt; e.vx *= 0.86; continue; }

            var dx = p.x - e.x, adx = Math.abs(dx);
            e.facing = dx < 0 ? -1 : 1;

            if (e.type === "archer") {
                var want = adx < 260 ? -1 : (adx > 380 ? 1 : 0);
                e.x += want * e.spd * dt * (dx > 0 ? 1 : -1) * -1;
                e.attackCd -= dt;
                if (e.attackCd <= 0 && adx < 700) {
                    e.attackCd = 2.3;
                    var ang = Math.atan2((p.y - 30) - (e.y - e.h * 0.6), dx);
                    arrows.push({ x: e.x, y: e.y - e.h * 0.6, vx: Math.cos(ang) * 420, vy: Math.sin(ang) * 420, rot: ang });
                    sfx.bow();
                }
            } else if (e.type === "boss") {
                // slow approach + hover bob
                e.y = groundY - 40 + Math.sin(e.animT * 2) * 8;
                if (adx > 90) e.x += (dx > 0 ? 1 : -1) * e.spd * dt;
                e.attackCd -= dt; e.summonCd -= dt;
                if (e.attackCd <= 0 && adx < 620) {
                    e.attackCd = 1.9;
                    for (var s = -1; s <= 1; s++) {
                        var ba = Math.atan2((p.y - 30) - (e.y - 40), dx) + s * 0.28;
                        arrows.push({ x: e.x, y: e.y - 40, vx: Math.cos(ba) * 330, vy: Math.sin(ba) * 330, rot: ba, boss: true });
                    }
                    sfx.bow();
                }
                if (e.summonCd <= 0) {
                    e.summonCd = 3.6;
                    spawnEnemy("walker"); spawnEnemy("crawler");
                    popup(e.x, e.y - e.h, "RISE!", "#ff2222");
                }
                updateBossBar();
                if (adx < 100 && e.attackCd < 1.2 && p.invuln <= 0) damagePlayer(e.dmg, e.x);
            } else {
                // melee movers
                if (adx > (e.w + p.w) / 2 - 4) e.x += (dx > 0 ? 1 : -1) * e.spd * dt;
                e.attackCd -= dt;
                if (adx < (e.w + p.w) / 2 + 6 && e.attackCd <= 0) {
                    e.attackCd = e.type === "crawler" ? 0.75 : 1.0;
                    damagePlayer(e.dmg, e.x);
                }
            }
            if (e.x < -80) enemies.splice(i, 1);
        }

        // ---- arrows ----
        for (var ai = arrows.length - 1; ai >= 0; ai--) {
            var ar = arrows[ai];
            ar.x += ar.vx * dt; ar.y += ar.vy * dt;
            if (ar.y > groundY + 20 || ar.x < -40 || ar.x > W + 40) { arrows.splice(ai, 1); continue; }
            if (Math.abs(ar.x - p.x) < 20 && ar.y > p.y - p.h && ar.y < p.y + 4) {
                damagePlayer(ar.boss ? 2 : 1, ar.x, true);
                if (!(player.blocking)) { addParticles(ar.x, ar.y, 5, "#ff2222"); arrows.splice(ai, 1); }
            }
        }

        // ---- pickups ----
        for (var pi = pickups.length - 1; pi >= 0; pi--) {
            var pk = pickups[pi];
            pk.t += dt;
            pk.vy += 900 * dt;
            pk.y += pk.vy * dt;
            if (pk.y > groundY - 10) { pk.y = groundY - 10; pk.vy = 0; }
            if (pk.t > 9) { pickups.splice(pi, 1); continue; }
            if (Math.abs(pk.x - p.x) < 34 && Math.abs(pk.y - (p.y - 26)) < 44) {
                if (pk.kind === "heart") { p.hp = Math.min(p.maxHp, p.hp + 1); popup(pk.x, pk.y - 20, "+HP", "#ff4444"); }
                else { p.rage = Math.min(100, p.rage + 30); popup(pk.x, pk.y - 20, "+RAGE", "#ff9900"); }
                sfx.pickup();
                addParticles(pk.x, pk.y, 8, pk.kind === "heart" ? "#ff4444" : "#ff9900", 180, 200);
                pickups.splice(pi, 1);
            }
        }

        // ---- fx ----
        for (var q = particles.length - 1; q >= 0; q--) {
            var pt = particles[q];
            pt.t += dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 850 * dt;
            if (pt.t >= pt.life) particles.splice(q, 1);
        }
        for (var sl = slashes.length - 1; sl >= 0; sl--) { slashes[sl].t += dt; if (slashes[sl].t > 0.18) slashes.splice(sl, 1); }
        for (var po = popups.length - 1; po >= 0; po--) { popups[po].t += dt; if (popups[po].t > 1) popups.splice(po, 1); }

        if (shake > 0) shake = Math.max(0, shake - dt * 46);
        if (hitFlash > 0) hitFlash -= dt;

        // HUD
        hpEl.textContent = "\u2665".repeat(Math.max(0, player.hp));
        waveEl.textContent = "WAVE " + wave;
        scoreEl.textContent = score + " PTS";
        var curCombo = 0; // displayed via best tracking below
        rageFill.style.width = (player.rageActive ? 100 : player.rage) + "%";
        rageLabel.textContent = player.rageActive ? "RAGE ACTIVE " + Math.ceil(player.rageT) + "s" : (player.rage >= 100 ? "RAGE READY! [I]" : "RAGE [I]");
        if (player.comboStep === 2) comboEl.textContent = ""; else comboEl.textContent = "";
    }

    function updateBossBar() {
        if (boss) bossFill.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + "%";
    }

    /* ============================================================ RENDER */
    function render() {
        ctx.clearRect(0, 0, W, H);
        var g = ctx.createRadialGradient(W / 2, H * 0.35, 40, W / 2, H * 0.35, Math.max(W, H) * 0.72);
        g.addColorStop(0, "#190202");
        g.addColorStop(1, "#050505");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

        // ground
        ctx.strokeStyle = "#3a0000"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, groundY + 31); ctx.lineTo(W, groundY + 31); ctx.stroke();
        ctx.fillStyle = "rgba(160,160,160,.12)";
        for (var bx = 0; bx < W; bx += 140) {
            ctx.fillRect(bx + 30, groundY + 36, 26, 3);
            ctx.fillRect(bx + 78, groundY + 39, 14, 3);
        }

        drawPlayer();
        drawSlashes();
        for (var i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
        drawArrows();
        drawPickups();
        drawParticles();
        drawPopups();

        ctx.restore();

        if (player.rageActive) {
            ctx.fillStyle = "rgba(255,40,0,.07)";
            ctx.fillRect(0, 0, W, H);
        }
        if (hitFlash > 0) {
            ctx.fillStyle = "rgba(255,0,0," + (hitFlash * 0.55) + ")";
            ctx.fillRect(0, 0, W, H);
        }
        if (player.hp === 1 && !gameOver) {
            var hb = 0.12 + Math.abs(Math.sin(performance.now() / 300)) * 0.14;
            var v = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H);
            v.addColorStop(0, "rgba(0,0,0,0)");
            v.addColorStop(1, "rgba(180,0,0," + hb + ")");
            ctx.fillStyle = v;
            ctx.fillRect(0, 0, W, H);
        }
        var vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H);
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,.75)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
    }

    function drawPlayer() {
        var p = player;
        if (p.invuln > 0 && p.dashT <= 0 && Math.floor(p.invuln * 14) % 2 === 0) return;
        ctx.save();
        ctx.translate(p.x, p.y);
        if (p.facing === -1) ctx.scale(-1, 1);
        ctx.lineCap = "round";
        var aura = p.rageActive;
        ctx.strokeStyle = aura ? "#ff7744" : "#e8e8e8";
        ctx.lineWidth = 4;
        ctx.shadowColor = aura ? "rgba(255,80,0,.95)" : "rgba(255,30,30,.8)";
        ctx.shadowBlur = aura ? 18 : 8;

        var moving = Math.abs(p.vx) > 10;
        var legSwing = p.onGround ? Math.sin(p.animT * 11) * (moving ? 11 : 2) : -9;
        var bob = moving ? Math.sin(p.animT * 11) * 2 : 0;

        // legs
        ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(-10, legSwing); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(10, -legSwing); ctx.stroke();
        // torso
        ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, -46); ctx.stroke();
        // arms + sword
        var armAng = p.attackT > 0 ? -1.5 : Math.sin(p.animT * 11) * 0.4;
        ctx.save();
        ctx.translate(0, -42); ctx.rotate(armAng);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 6); ctx.stroke();
        var swordCol = p.attackKind === "heavy" ? "#ffcc00" : "#ff2222";
        ctx.strokeStyle = swordCol;
        ctx.lineWidth = p.attackKind === "heavy" ? 5 : 3;
        ctx.shadowColor = swordCol; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.moveTo(16, 6);
        if (p.attackKind === "light2") { ctx.lineTo(38, -14); } else { ctx.lineTo(40, -8); }
        ctx.stroke();
        ctx.restore();
        // off arm
        ctx.strokeStyle = aura ? "#ff7744" : "#e8e8e8";
        ctx.shadowBlur = aura ? 14 : 8;
        ctx.save();
        ctx.translate(0, -42); ctx.rotate(-armAng * 0.5);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-14, 8); ctx.stroke();
        ctx.restore();
        // shield when blocking
        if (p.blocking) {
            ctx.fillStyle = "rgba(120,120,130,.85)";
            ctx.strokeStyle = "#55555f"; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, -52); ctx.lineTo(26, -46); ctx.lineTo(26, -24); ctx.lineTo(12, -16);
            ctx.lineTo(-2, -24); ctx.lineTo(-2, -46); ctx.closePath();
            ctx.fill(); ctx.stroke();
            if (p.blockT < 0.18) { ctx.strokeStyle = "#ffe14d"; ctx.strokeRect(-4, -54, 34, 42); }
        }
        // head
        ctx.fillStyle = "#f2f2f2";
        ctx.beginPath(); ctx.arc(0, -56 + bob * 0.3, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = aura ? "#ff3300" : "#c01010";
        ctx.fillRect(-5, -59 + bob * 0.3, 3, 3);
        ctx.fillRect(2, -59 + bob * 0.3, 3, 3);
        // dash streak
        if (p.dashT > 0) {
            ctx.globalAlpha = 0.4;
            ctx.strokeStyle = aura ? "#ff6600" : "#aaaaaa";
            ctx.beginPath(); ctx.moveTo(-30, -30); ctx.lineTo(-70, -30); ctx.stroke();
            ctx.globalAlpha = 1;
        }
        ctx.restore();
    }

    function drawSlashes() {
        for (var i = 0; i < slashes.length; i++) {
            var sl = slashes[i], pr = sl.t / 0.18;
            ctx.save();
            ctx.translate(sl.x, sl.y);
            ctx.scale(sl.dir, 1);
            var c = sl.heavy ? "255," + Math.floor(140 + 60 * pr) + ",0" : "255," + Math.floor(60 + 120 * pr) + "," + Math.floor(60 * pr);
            ctx.strokeStyle = "rgba(" + c + "," + (1 - pr) + ")";
            ctx.lineWidth = sl.heavy ? 7 : 5;
            ctx.shadowColor = sl.heavy ? "#ffaa00" : "#ff2222";
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(0, 0, (sl.heavy ? 36 : 30) + pr * 28, -1.1 + pr * 1.4, 0.5 + pr * 1.4);
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawEnemy(e) {
        var wob = Math.sin(e.animT * 9) * 3;
        var col = e.hurt > 0 ? "#ff6666" :
                  e.type === "shield" ? "#d8cbb0" :
                  e.type === "archer" ? "#c9b8e0" :
                  e.type === "crawler" ? "#b8d8b8" :
                  e.type === "boss" ? "#ff8866" : "#cfcfcf";
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.lineCap = "round";

        if (e.type === "boss") {
            var bs = Math.sin(e.animT * 2.2) * 6;
            ctx.strokeStyle = col; ctx.lineWidth = 6;
            ctx.shadowColor = "rgba(255,60,20,.9)"; ctx.shadowBlur = 22;
            // cloak body
            ctx.fillStyle = "#1a0505";
            ctx.strokeStyle = "#5e1410"; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, -120 + bs);
            ctx.quadraticCurveTo(58, -70, 48, 10);
            ctx.lineTo(-48, 10);
            ctx.quadraticCurveTo(-58, -70, 0, -120 + bs);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            // arms
            ctx.strokeStyle = col; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(0, -80 + bs); ctx.lineTo(-44, -50 + bs); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -80 + bs); ctx.lineTo(44, -50 + bs); ctx.stroke();
            // giant skull head
            ctx.fillStyle = "#e5dcc8";
            ctx.shadowBlur = 16;
            ctx.beginPath(); ctx.arc(0, -126 + bs, 30, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#0a0000";
            ctx.beginPath(); ctx.ellipse(-12, -130 + bs, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(12, -130 + bs, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ff2200";
            ctx.shadowColor = "#ff2200"; ctx.shadowBlur = 20;
            ctx.beginPath(); ctx.arc(-12, -130 + bs, 3.4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(12, -130 + bs, 3.4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#0a0000";
            ctx.beginPath(); ctx.moveTo(0, -122 + bs); ctx.lineTo(-6, -108 + bs); ctx.lineTo(6, -108 + bs); ctx.closePath(); ctx.fill();
            ctx.restore();
            return;
        }

        ctx.strokeStyle = col;
        ctx.lineWidth = e.type === "crawler" ? 3 : 3.5;
        if (e.type === "shield") { ctx.shadowColor = "rgba(220,200,150,.5)"; ctx.shadowBlur = 8; }
        var hh = e.h;
        if (e.type === "crawler") {
            // hunched little thing
            ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-11 + wob * 0.5, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(11 - wob * 0.5, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, -26); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(-16, -14 + wob * 0.4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(-15, -8 - wob * 0.4); ctx.stroke();
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(0, -30, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(-4.5, -33, 3, 3); ctx.fillRect(1.5, -33, 3, 3);
        } else {
            // legs
            ctx.beginPath(); ctx.moveTo(0, -hh * 0.36); ctx.lineTo(-9 + wob * 0.4, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -hh * 0.36); ctx.lineTo(9 - wob * 0.4, 0); ctx.stroke();
            // spine
            ctx.beginPath(); ctx.moveTo(0, -hh * 0.36); ctx.lineTo(0, -hh * 0.74); ctx.stroke();
            // ribs
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(-8, -hh * 0.63); ctx.lineTo(8, -hh * 0.63); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-7, -hh * 0.52); ctx.lineTo(7, -hh * 0.52); ctx.stroke();
            // arms forward
            ctx.lineWidth = 3.5;
            ctx.beginPath(); ctx.moveTo(0, -hh * 0.7); ctx.lineTo(-14, -hh * 0.55 + wob * 0.3); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -hh * 0.7); ctx.lineTo(-13, -hh * 0.42 - wob * 0.3); ctx.stroke();
            // skull head
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(0, -hh * 0.87, 8.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(-5.5, -hh * 0.93, 3.5, 4);
            ctx.fillRect(2, -hh * 0.93, 3.5, 4);
            ctx.fillRect(-3, -hh * 0.79, 6, 2);
            // shield plate
            if (e.type === "shield") {
                ctx.fillStyle = "rgba(140,130,110,.9)";
                ctx.strokeStyle = "#3a3226"; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-20, -hh * 0.95); ctx.lineTo(-26, -hh * 0.6); ctx.lineTo(-18, -hh * 0.15);
                ctx.lineTo(-10, -hh * 0.5); ctx.lineTo(-10, -hh * 0.85);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
            }
            // bow for archer
            if (e.type === "archer") {
                ctx.strokeStyle = "#8a6fc0"; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(-16, -hh * 0.6, 12, -1.2, 1.2); ctx.stroke();
            }
            // hp pips
            if (e.maxHp > 1) {
                ctx.shadowBlur = 0;
                for (var h2 = 0; h2 < e.hp; h2++) {
                    ctx.fillStyle = "#ff2222";
                    ctx.fillRect(-10 + h2 * 8, -hh - 14, 5, 4);
                }
            }
        }
        ctx.restore();
    }

    function drawArrows() {
        for (var i = 0; i < arrows.length; i++) {
            var ar = arrows[i];
            ctx.save();
            ctx.translate(ar.x, ar.y);
            ctx.rotate(ar.rot);
            ctx.strokeStyle = ar.boss ? "#ff5533" : "#d8d0c0";
            ctx.lineWidth = 2.5;
            ctx.shadowColor = ar.boss ? "rgba(255,60,20,.8)" : "transparent";
            ctx.shadowBlur = ar.boss ? 12 : 0;
            ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(10, 0); ctx.stroke();
            ctx.fillStyle = ar.boss ? "#ff5533" : "#aaa";
            ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(6, -4); ctx.lineTo(6, 4); ctx.closePath(); ctx.fill();
            ctx.restore();
        }
    }

    function drawPickups() {
        for (var i = 0; i < pickups.length; i++) {
            var pk = pickups[i];
            var fl = Math.sin(pk.t * 6) * 4;
            ctx.save();
            ctx.translate(pk.x, pk.y + fl);
            ctx.shadowColor = pk.kind === "heart" ? "#ff3333" : "#ff9900";
            ctx.shadowBlur = 14;
            ctx.fillStyle = pk.kind === "heart" ? "#ff3333" : "#ff9900";
            if (pk.kind === "heart") {
                ctx.beginPath();
                ctx.moveTo(0, 6); ctx.bezierCurveTo(-10, -4, -6, -12, 0, -6);
                ctx.bezierCurveTo(6, -12, 10, -4, 0, 6);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.fillRect(-1.5, -9, 3, 18); ctx.fillRect(-9, -1.5, 18, 3);
            }
            ctx.restore();
        }
    }

    function drawParticles() {
        for (var i = 0; i < particles.length; i++) {
            var pp = particles[i];
            ctx.globalAlpha = 1 - pp.t / pp.life;
            ctx.fillStyle = pp.col;
            ctx.fillRect(pp.x - pp.sz / 2, pp.y - pp.sz / 2, pp.sz, pp.sz);
        }
        ctx.globalAlpha = 1;
    }

    function drawPopups() {
        ctx.textAlign = "center";
        for (var i = 0; i < popups.length; i++) {
            var po = popups[i];
            ctx.globalAlpha = 1 - po.t;
            ctx.fillStyle = po.col;
            ctx.font = "bold 15px 'Courier New',monospace";
            ctx.fillText(po.txt, po.x, po.y - po.t * 44);
        }
        ctx.globalAlpha = 1;
    }

    /* ============================================================ LOOP */
    var lastT = 0;
    function loop(t) {
        if (!running) return;
        var raw = Math.min(0.05, (t - lastT) / 1000 || 0.016);
        lastT = t;
        if (paused) { render(); requestAnimationFrame(loop); return; }
        if (freezeT > 0) { freezeT -= raw; render(); requestAnimationFrame(loop); return; }
        update(raw);
        render();
        requestAnimationFrame(loop);
    }

    function startGame() {
        landing.style.display = "none";
        footer.style.display = "none";
        gameWrap.style.display = "block";
        resize();
        reset();
        running = true;
        paused = false;
        lastT = performance.now();
        ac(); // unlock audio on this user gesture
        requestAnimationFrame(loop);
    }

    enterBtn.addEventListener("click", startGame);
})();
</script>
<script src="script.js"></script>
</body>
